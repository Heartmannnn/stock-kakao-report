name: Daily Kakao Stock Report

on:
  schedule:
    # 한국시간(KST) 오전 09:00 = UTC 00:00
    - cron: '0 0 * * *'
  workflow_dispatch: # GitHub 웹 상에서 언제든 수동으로 실행 가능

jobs:
  send-report:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Kakao Report Sender
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
        run: |
          python send_kakao_report.py
