name: Project 4 Manual Chat Log Investment AI Analyzer (Cloud Task)

on:
  push:
    paths:
      - 'project4_invest_analyzer/chat_logs/**'
  workflow_dispatch: # GitHub 웹 상에서 언제든 수동 버튼으로 실행 가능

permissions:
  contents: write

jobs:
  analyze-project4-chat-log:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run Project 4 Investment Analysis Engine & Kakao Sender
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python project4_invest_analyzer/project4_github_action.py

      - name: Commit and push updated Project 4 report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Project 4 Investment Report by Cloud Action" && git push)
