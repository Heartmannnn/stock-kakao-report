name: Daily S&P500 & BigTech Morning Report (Project 2 Cloud Task)

on:
  schedule:
    # [1회성 11:00 AM KST 테스트 스케줄] UTC 02:00 = KST 11:00 AM (8월 8일)
    - cron: '0 2 8 8 *'
    # [정기 스케줄] 매일 한국시간(KST) 오전 09:00 정기 발송 = UTC 00:00
    - cron: '0 0 * * *'
  workflow_dispatch: # GitHub 웹 상에서 언제든 수동 버튼으로 실행 가능

permissions:
  contents: write

jobs:
  send-sp500-report:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run S&P500 & BigTech Report Generator & Kakao Sender
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python sp500_bigtech_summary/sp500_github_action.py

      - name: Commit and push updated report file
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sp500_bigtech_report.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update S&P500 & BigTech report by GitHub Actions (Cloud)" && git push)
